name: Publish verified dataset

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dataset release version, for example v1
        required: true
        default: v1
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install publisher dependencies
        run: npm ci

      - name: Install Hugging Face CLI
        run: pip install --disable-pip-version-check huggingface_hub

      - name: Build ZIP packages and upload them
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/publish_verified_dataset.mjs --version "${{ inputs.version }}" --upload
